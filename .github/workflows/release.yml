name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # package-lock.json is gitignored in this repo, so there is no committed
      # lockfile to validate against; use `npm install` rather than `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$pkg_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - run: npm publish --provenance --access public
