<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="@prcompass/core — the deterministic engine for PR Compass. Turns a list of git commits into per-file risk metrics. No network. No LLM. No database."
    />
    <title>@prcompass/core — deterministic risk engine for git history</title>

    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@prcompass/core" />
    <meta property="og:title" content="@prcompass/core — deterministic risk engine for git history" />
    <meta
      property="og:description"
      content="Mining → churn → cochange → hotspots → risk. ~7.5 ms over 10 000 commits. Same input always produces the same bytes."
    />

    <meta name="twitter:card" content="summary" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
